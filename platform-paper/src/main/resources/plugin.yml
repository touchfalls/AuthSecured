name: AuthSecured
version: '${version}'
main: io.github.touchfalls.authsecured.AuthSecuredPlugin
api-version: '1.21'
folia-supported: true
author: touchfalls
description: Authentication plugin for Paper, Purpur, Folia, Spigot, and Leaf 1.21 through current releases.

commands:
  login:
    description: Authenticate with password.
    usage: /login <password>
    aliases: [l]
  register:
    description: Register account with password.
    usage: /register <password> <confirmPassword>
    aliases: [reg]
  changepassword:
    description: Change account password.
    usage: /changepassword <oldPassword> <newPassword>
    aliases: [cp]
  logout:
    description: Logout from current session.
    usage: /logout
  authstatus:
    description: Check authentication status.
    usage: /authstatus
  2fa:
    description: Set up or use two-factor authentication.
    usage: /2fa <code|enable|confirm <code>|disable <code>|status>
  sessions:
    description: Show or end your saved login sessions.
    usage: /sessions [revoke]
  authadmin:
    description: Admin authentication operations.
    usage: /authadmin <status|doctor|reload|session|audit|unlock|unregister|resetpassword>

permissions:
  authsecured.admin:
    description: Grants every AuthSecured administrative operation.
    default: op
    children:
      authsecured.admin.status: true
      authsecured.admin.doctor: true
      authsecured.admin.reload: true
      authsecured.admin.session: true
      authsecured.admin.audit: true
      authsecured.admin.unlock: true
      authsecured.admin.unregister: true
      authsecured.admin.resetpassword: true
  authsecured.admin.status:
    description: View runtime status.
    default: op
  authsecured.admin.doctor:
    description: Run configuration and dependency diagnostics.
    default: op
  authsecured.admin.reload:
    description: Reload runtime configuration.
    default: op
  authsecured.admin.session:
    description: Inspect and change the runtime session timeout.
    default: op
  authsecured.admin.audit:
    description: View privacy-safe authentication audit entries.
    default: op
  authsecured.admin.unlock:
    description: Unlock accounts.
    default: op
  authsecured.admin.unregister:
    description: Delete accounts.
    default: op
  authsecured.admin.resetpassword:
    description: Generate temporary account passwords.
    default: op
