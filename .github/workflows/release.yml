name: Release

# Pushing a tag such as v1.3.1 builds every artifact, creates the GitHub release and uploads
# the files to Modrinth. Needs the MODRINTH_TOKEN repository secret ("Create versions" scope)
# and MODRINTH_CHANGELOG_<version>.md, which is used for both release pages.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Same toolchains as the Build workflow, passed to the scripts' Gradle calls.
      GRADLE_OPTS: -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_26_X64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: |
            26
            21
      - name: Check that the tag, the project version and the release notes agree
        run: |
          version=$(sed -n 's/.*version = "\([^"]*\)".*/\1/p' build.gradle.kts | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the project version $version" >&2
            exit 1
          fi
          test -f "MODRINTH_CHANGELOG_$version.md"
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Test and build the Paper jar and every Fabric target
        run: AUTHSECURED_FULL_MATRIX=true ./build_and_test.sh
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" build/libs/authsecured-*.jar
          --title "AuthSecured $VERSION" --notes-file "MODRINTH_CHANGELOG_$VERSION.md"
      # Safe to re-run: versions already on Modrinth are skipped.
      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: python3 scripts/publish_modrinth.py --publish
