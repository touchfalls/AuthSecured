name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Gradle runs on Java 21 (the last JDK set up); Minecraft 26.x Fabric builds use the
  # Java 26 toolchain. Pointing Gradle at both avoids downloading them again.
  GRADLE_TOOLCHAINS: -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_26_X64

jobs:
  build:
    name: Tests, Paper and Fabric (default version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            26
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests and build both artifacts
        run: ./gradlew $GRADLE_TOOLCHAINS clean test :platform-paper:build :platform-fabric:build
      - uses: actions/upload-artifact@v7
        with:
          name: authsecured-${{ github.sha }}
          path: |
            platform-paper/build/libs/authsecured-paper-*.jar
            platform-fabric/build/libs/authsecured-fabric-*+mc*.jar
          if-no-files-found: error

  fabric-versions:
    name: List supported Fabric versions
    runs-on: ubuntu-latest
    outputs:
      minecraft: ${{ steps.list.outputs.minecraft }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        # build_fabric_matrix.sh is the single list of supported Fabric targets.
        run: |
          versions=$(sed -n '/^versions=(/,/^)/p' build_fabric_matrix.sh | grep -o '"[^"]*"' | tr -d '"' | jq -R . | jq -sc .)
          echo "minecraft=$versions" >> "$GITHUB_OUTPUT"

  fabric:
    name: Fabric ${{ matrix.minecraft }}
    needs: fabric-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ${{ fromJson(needs.fabric-versions.outputs.minecraft) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            26
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test the Fabric artifact
        run: ./gradlew $GRADLE_TOOLCHAINS :platform-fabric:clean :platform-fabric:build -Pminecraft_version=${{ matrix.minecraft }}
