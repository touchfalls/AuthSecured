# Plugin Language: en, ru, es, it, fr
language: "en"

database:
  type: sqlite # sqlite or postgresql

  postgresql:
    host: localhost
    port: 5432
    database: authsecured
    username: authsecured
    password-env: "${ENV:AUTHSECURED_DB_PASSWORD}"
    ssl: false
    pool-size: 10

  sqlite:
    file: auth.db

security:
  ip-hashing:
    secret-env: "${ENV:AUTHSECURED_IP_SECRET}"

  password:
    min-length: 10
    max-length: 128

    argon2:
      memory-kib: 65536
      iterations: 3
      parallelism: 2
      hash-length: 32
      salt-length: 16

  login:
    timeout-seconds: 60

  rate-limit:
    login:
      per-account:
        max-attempts: 5
        window-seconds: 600
        lock-seconds: 900

      per-ip:
        max-attempts: 20
        window-seconds: 600
        lock-seconds: 1800

  registration:
    max-accounts-per-ip: 3
    max-attempts-per-hour: 10

session:
  enabled: true # Enable/disable re-login session auto-bypass
  persistent: true # Save sessions to database across server restarts
  timeout-seconds: 1800 # Session duration in seconds (1800 = 30 min)
  verify-ip: true # Verify player IP address matches session IP

redis:
  enabled: false
  uri-env: "${ENV:AUTHSECURED_REDIS_URI}"

auth:
  online-mode:
    bypass-password: true

restrictions:
  freeze-player: true          # Prevent movement before authentication
  allow-flight: false          # Prevent flying before authentication
  block-chat: true             # Block chat messages from unauthenticated players
  block-commands: true         # Block non-auth commands
  allowed-commands:            # Commands allowed while unauthenticated
    - "/login"
    - "/l"
    - "/register"
    - "/reg"
    - "/changepassword"
    - "/cp"
  block-inventory: true        # Prevent opening or clicking inventory
  block-interactions: true     # Prevent interacting with blocks/chests/doors
  block-block-break: true      # Prevent breaking blocks
  block-block-place: true      # Prevent placing blocks
  block-damage-taken: true     # Protect unauthenticated player from damage
  block-damage-dealt: true     # Prevent unauthenticated player from attacking
  block-item-drop: true        # Prevent dropping items
  block-item-pickup: true      # Prevent picking up items
  block-hunger: true           # Prevent losing hunger points

logging:
  audit:
    enabled: true
  debug: false
