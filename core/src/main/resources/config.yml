# AuthSecured configuration
#
# Language, restrictions, session timeout and extension, and authentication
# timeout changes are applied by /authadmin reload. Database, Redis, password
# hashing, and notification endpoint changes require a full server restart.
# Durations are in seconds and memory values are in KiB unless stated otherwise.

# Message language. Available values: en, ru, es, it, fr.
language: "en"

database:
  # Storage engine: sqlite (simple, no external server) or postgresql.
  type: "sqlite"

  sqlite:
    # Relative paths are resolved inside the AuthSecured data directory.
    file: "auth.db"

  postgresql:
    # These settings are used only when database.type is postgresql.
    host: "localhost"
    port: 5432
    database: "authsecured"
    username: "authsecured"

    # Never put the database password directly in this file. The ENV syntax
    # reads it from an operating-system environment variable at startup.
    password-env: "${ENV:AUTHSECURED_DB_PASSWORD}"

    # PostgreSQL modes: disable, allow, prefer, require, verify-ca, verify-full.
    # Use verify-full in production after configuring trusted certificates.
    ssl-mode: "prefer"

    # Maximum database connections. Allowed range: 1..64.
    pool-size: 10

security:
  ip-hashing:
    # Private HMAC secret used to anonymize IP addresses. Set a long, random,
    # stable value in the named environment variable before public deployment.
    # Changing it invalidates IP-bound sessions and rate-limit identities.
    secret-env: "${ENV:AUTHSECURED_IP_SECRET}"

  password:
    # Accepted player password length. Allowed minimum is 8 characters.
    min-length: 10
    max-length: 128

    # Argon2id cost parameters. Defaults are suitable for most servers.
    # Increasing them improves resistance to cracking but uses more CPU/RAM.
    argon2:
      memory-kib: 65536       # 65536 KiB = 64 MiB per hashing operation
      iterations: 3
      parallelism: 2
      hash-length: 32         # Output size in bytes
      salt-length: 16         # Random salt size in bytes

  rate-limit:
    login:
      # Limit failed attempts against one account name.
      per-account:
        max-attempts: 5
        window-seconds: 600
        lock-seconds: 900

      # Limit failed attempts coming from one anonymized IP address.
      per-ip:
        max-attempts: 20
        window-seconds: 600
        lock-seconds: 1800

  registration:
    # Maximum registered accounts linked to one anonymized IP.
    max-accounts-per-ip: 3
    # Maximum registration attempts from one IP during a rolling hour.
    max-attempts-per-hour: 10

session:
  # Allow a valid reconnect session to authenticate a player automatically.
  enabled: true
  # true stores sessions in the database; false loses them on server restart.
  persistent: true
  # Session lifetime. 1800 seconds = 30 minutes. Range: 1..2592000 (30 days).
  timeout-seconds: 1800
  # Reject a saved session when the player's anonymized IP has changed.
  verify-ip: true
  # Keep an authenticated player's session alive while they stay online, so the
  # lifetime above counts from when they leave instead of from login. On a proxy
  # network whose servers share one database, players can then switch servers
  # without logging in again, however long they have been playing.
  extend-while-online: false

redis:
  # Optional shared rate-limit storage. Keep false for the in-memory store.
  enabled: false
  # Stop startup if Redis is unavailable. Recommended for proxy networks that
  # require one shared rate limit across several servers.
  required: false
  # Preferred connection method. Example value: redis://user:password@host:6379
  uri-env: "${ENV:AUTHSECURED_REDIS_URI}"
  # Used only when uri-env resolves to an empty value.
  host: "localhost"
  port: 6379

auth:
  online-mode:
    # Automatically trust UUID-authenticated players on an online-mode server.
    # This does not bypass passwords on an offline-mode backend.
    bypass-password: true

auth-timeout:
  # Kick players who do not register or log in before the deadline.
  enabled: true
  # Allowed range: 5..3600. The countdown starts on join and after /logout.
  timeout-seconds: 60

admin:
  temporary-password:
    # /authadmin resetpassword <player> generates a random temporary password.
    # It is shown once to the administrator and never accepted as a command argument.
    length: 18                 # Allowed range: 12..64
    expires-seconds: 900       # Allowed range: 60..86400

  fabric-permission-levels:
    # Fabric uses vanilla permission levels 0..4 for each operation.
    status: 2
    doctor: 3
    reload: 3
    session: 3
    audit: 3
    unlock: 3
    unregister: 4
    resetpassword: 4

restrictions:
  # Controls applied only until the player authenticates.
  freeze-player: true          # Block position changes
  allow-flight: false          # Allow flight packets before authentication
  block-chat: true             # Block public chat messages
  block-commands: true         # Block commands not listed below

  # Use lowercase command labels including the leading slash. Arguments are not
  # allowed here. This list does not create command aliases. Keep every
  # registered authentication command players need before login.
  allowed-commands:
    - "/login"
    - "/l"
    - "/register"
    - "/reg"
    - "/changepassword"
    - "/cp"

  block-inventory: true        # Block opening and clicking inventories
  block-interactions: true     # Block block, item and entity interactions
  block-block-break: true      # Block breaking blocks
  block-block-place: true      # Block placing blocks
  block-damage-taken: true     # Protect the player from incoming damage
  block-damage-dealt: true     # Block attacks made by the player
  block-item-drop: true        # Block dropping items
  block-item-pickup: true      # Block collecting item entities
  block-hunger: true           # Prevent hunger level changes

logging:
  audit:
    # Store security events and authentication attempts in the database.
    enabled: true
    # Delete audit rows older than this many days. Range: 1..3650.
    retention-days: 30
    # Run session and audit cleanup at this interval. Range: 60..86400 seconds.
    cleanup-interval-seconds: 3600

notifications:
  login-failures:
    # Send a privacy-safe alert after a failed login. Passwords and raw IPs are
    # never included. Repeated alerts for one player are limited by cooldown.
    enabled: false
    cooldown-seconds: 300      # Allowed range: 10..86400

  discord:
    # Enable this channel and configure one of the two values below.
    enabled: false
    # Simple setup. Keep empty when using the environment variable.
    # Treat this URL as a secret and restrict access to config.yml.
    webhook-url: ""
    # Safer production setup. Example variable: AUTHSECURED_DISCORD_WEBHOOK
    webhook-url-env: "${ENV:AUTHSECURED_DISCORD_WEBHOOK}"

  telegram:
    # Enable this channel and configure either direct values or environment variables.
    enabled: false
    # Simple setup. The bot token is secret; keep these empty when using ENV.
    bot-token: ""
    chat-id: ""
    # Safer production setup. Create the bot with BotFather and set both variables.
    bot-token-env: "${ENV:AUTHSECURED_TELEGRAM_BOT_TOKEN}"
    chat-id-env: "${ENV:AUTHSECURED_TELEGRAM_CHAT_ID}"

# Password arguments of /login, /register, /changepassword and their aliases
# are always protected from command diagnostics. On Paper, the built-in raw
# command log is blocked before formatting and the later command event is
# redacted before dispatch. This protection is not configurable.
